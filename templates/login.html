<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpectrumSim - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        /* ================= LOGO ================= */

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 28px;
            color: #172033;
            margin-bottom: 7px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-title {
            font-size: 22px;
            font-weight: bold;
            color: #172033;
            margin-bottom: 6px;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1px solid #d7dee8;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2864e6;
            box-shadow: 0 0 0 3px rgba(40, 100, 230, 0.1);
        }

        /* ================= OPTIONS ================= */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #64748b;
        }

        .remember input {
            width: auto;
            padding: 0;
        }

        .forgot {
            color: #2864e6;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ================= BUTTON ================= */

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2864e6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* ================= DEMO LOGIN ================= */

        .demo-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .demo-box p {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .demo-box strong {
            color: #334155;
            font-size: 13px;
        }

        /* ================= FOOTER ================= */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- ================= LOGO ================= -->

            <div class="logo">

                <div class="logo-icon">
                    📡
                </div>

                <h1>
                    SpectrumSim
                </h1>

                <p>
                    Intelligent Spectrum Allocation Simulator
                </p>

            </div>


            <!-- ================= LOGIN ================= -->

            <div class="form-title">
                Welcome Back
            </div>

            <div class="form-subtitle">
                Login to access your SpectrumSim dashboard
            </div>


            <form method="POST" action="{{ url_for('login') }}">

                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- Options -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- ================= DEMO LOGIN ================= -->

            <div class="divider">
                Demo Access
            </div>

            <div class="demo-box">

                <p>
                    Use the following credentials for testing
                </p>

                <strong>
                    Username: admin
                </strong>

                <br>

                <strong>
                    Password: admin123
                </strong>

            </div>


            <!-- ================= FOOTER ================= -->

            <div class="footer">
                SpectrumSim © 2026
            </div>

        </div>

    </div>

</body>
</html>
